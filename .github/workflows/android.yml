name: Build APK from ZIP

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.2
      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.2/bin" >> "$GITHUB_PATH"

      # 4. Распаковываем 1.zip
      - name: Unzip project
        run: |
          rm -rf project
          mkdir project
          unzip -q 1.zip -d project

      # 5. Проверяем проект
      - name: Check project
        run: |
          cd project
          echo "=== Project ==="
          ls -la
          echo "=== App ==="
          ls -la app

      # 6. Проверяем Gradle
      - name: List Gradle projects
        run: |
          cd project
          gradle projects --no-daemon

      # 7. Собираем APK
      - name: Build APK
        run: |
          cd project
          gradle :app:assembleDebug --no-daemon --warning-mode all

      # 8. Загружаем APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioRecorder-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk

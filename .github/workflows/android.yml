name: /devil - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Очистка места на диске
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      # 3. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Find ANY ZIP and extract it
      - name: Find and unzip project
        shell: bash
        run: |
          set -e
          rm -rf project && mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP archive found"; exit 1
          fi
          unzip -q "$ZIP_FILE" -d project

      # 5. Automatically find Gradle project
      - name: Detect Android project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi
          if [ -z "$PROJECT_DIR" ]; then
            APP_DIR=$(find project -type d -name "app" -print -quit)
            if [ -n "$APP_DIR" ]; then
              PROJECT_DIR=$(dirname "$APP_DIR")
            fi
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle/Android project not found"; exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Применяем фиксы Gradle (зеркало + Jetifier)
      - name: Apply Gradle Fixes
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          # 6.1 Добавляем обход ошибки Jetifier для BouncyCastle
          echo "android.jetifier.ignorelist=bcprov-jdk18on" >> gradle.properties

          # 6.2 Создаем init-скрипт для перенаправления Maven Central на зеркало Google
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven_mirror.gradle << 'EOF'
          def central = ~/^https:\/\/(repo\.maven\.apache\.org|repo1\.maven\.org)\/maven2\/?/
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def fallback = 'mavenCentralBehindMirror'
          def addFallback = { RepositoryHandler repositories ->
              repositories.maven { name = fallback; url = 'https://repo.maven.apache.org/maven2/' }
          }
          def toMirror = { RepositoryHandler repositories ->
              def hasFallback = false
              repositories.all { repository ->
                  if (repository.name == fallback) return
                  if (repository instanceof MavenArtifactRepository) {
                      def url = repository.url.toString()
                      if (url =~ central) {
                          repository.url = url.replaceFirst(central, mirror)
                          if (!hasFallback) { hasFallback = true; addFallback(repositories); return }
                      }
                  }
              }
              def last = repositories.findByName(fallback)
              if (hasFallback && !repositories.last().is(last)) {
                  repositories.remove(last)
                  repositories.add(last)
              }
          }
          beforeSettings { settings ->
              toMirror(settings.buildscript.repositories)
              toMirror(settings.pluginManagement.repositories)
              toMirror(settings.dependencyResolutionManagement.repositories)
          }
          settingsEvaluated { settings ->
              if (settings.pluginManagement.repositories.isEmpty()) {
                  settings.pluginManagement.repositories { repositories ->
                      maven { url = mirror }
                      addFallback(repositories)
                      gradlePluginPortal()
                  }
              }
          }
          allprojects { project ->
              toMirror(project.buildscript.repositories)
              toMirror(project.repositories)
          }
          EOF
          echo "Maven mirror init script applied."

      # 7. Setup Gradle 8.5 (обновленная версия)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      # 8. Build APK
      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          rm -rf ~/.gradle/caches  # Очищаем кэш на всякий случай
          echo "=== Building APK ==="
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 9. Find APK automatically
      - name: Find APK
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -path "*/build/outputs/*" -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"; exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: devil-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

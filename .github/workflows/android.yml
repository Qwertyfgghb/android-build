name: /devil - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Очистка места на диске (критично для GitHub Actions)
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      # 3. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Find ANY ZIP and extract it
      - name: Find and unzip project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          echo "=== ZIP files ==="
          find . -maxdepth 1 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP archive found"
            exit 1
          fi

          echo
          echo "Using archive:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo
          echo "=== Extracted structure ==="
          find project -maxdepth 4 -type f | sort

      # 5. Automatically find Gradle project
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            APP_DIR=$(find project -type d -name "app" -print -quit)

            if [ -n "$APP_DIR" ]; then
              PROJECT_DIR=$(dirname "$APP_DIR")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle/Android project not found"
            echo
            echo "Possible project files:"
            find project -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "AndroidManifest.xml" \) \
              -print
            exit 1
          fi

          echo
          echo "======================================"
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Check structure
      - name: Check project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Current directory ==="
          pwd

          echo
          echo "=== Project ==="
          ls -la

          echo
          echo "=== App ==="
          if [ -d "app" ]; then
            ls -la app
          else
            echo "WARNING: app directory not found"
          fi

          echo
          echo "=== Gradle files ==="
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print

      # 7. Setup Gradle 8.2 (с отключенным кэшем, чтобы не тянуть битые файлы)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true

      # 8. Check Gradle (с полной очисткой кэша перед запуском)
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          # Полностью удаляем локальный кэш
          rm -rf ~/.gradle

          gradle --version

          echo
          echo "=== Gradle projects ==="

          gradle projects \
            --no-daemon \
            --stacktrace

      # 9. Build APK (с полной очисткой кэша перед запуском)
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          # На всякий случай чистим еще раз
          rm -rf ~/.gradle

          echo "=== Building APK ==="

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 10. Find APK automatically
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== Searching for APK ==="

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"

            echo
            echo "=== Build directory ==="
            find "$PROJECT_DIR" \
              -type d \
              -name "build" \
              -print

            exit 1
          fi

          echo
          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: devil-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

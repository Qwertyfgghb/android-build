name: /devil - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Находим любой ZIP и распаковываем его
      - name: Unzip Android project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found in repository root"
            exit 1
          fi

          echo "Found archive:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "=== Extracted files ==="
          find project -maxdepth 3 -type f | head -100

      # 4. Находим корень Android-проекта автоматически
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Сначала ищем Gradle Wrapper
          PROJECT_DIR=$(find project -type f -name "gradlew" -print -quit | xargs -r dirname)

          # Если gradlew нет — ищем settings.gradle / settings.gradle.kts
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find project -type f \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android/Gradle project not found inside ZIP"
            echo "Contents:"
            find project -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project detected:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Проверяем структуру
      - name: Check project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "PROJECT:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "=== Project files ==="
          ls -la

          echo "=== Modules ==="
          find . -maxdepth 2 -type d | sort

          echo "=== App ==="
          if [ -d "app" ]; then
            ls -la app
          else
            echo "WARNING: app directory not found"
          fi

      # 6. Проверяем Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew projects --no-daemon

      # 7. Собираем APK
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 8. Ищем APK автоматически
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== APK files ==="

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      # 9. Загружаем APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: devil-debug
          path: ${{ env.APK }}
          if-no-files-found: error

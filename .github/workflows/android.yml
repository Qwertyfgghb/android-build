name: Build TouchMeNot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем репозиторий
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Устанавливаем зависимости: JDK 17 и unzip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip openjdk-17-jdk

      # 3. Распаковываем ZIP с проектом
      - name: Unzip project
        run: |
          mkdir project
          unzip 1.zip -d project
          ls -R project

      # 4. Делаем gradlew исполняемым
      - name: Make gradlew executable
        run: |
          cd project/1         # <-- укажи путь к корню Android проекта внутри ZIP
          chmod +x gradlew

      # 5. Собираем APK через gradlew
      - name: Build APK
        working-directory: project/1
        run: |
          ./gradlew clean assembleDebug --stacktrace

      # 6. Загружаем APK как артефакт
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchMeNot-Debug-APK
          path: project/1/app/build/outputs/apk/debug/app-debug.apk

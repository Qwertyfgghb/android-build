name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find and unzip project
      run: |
        rm -rf project && mkdir -p project
        ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)
        unzip -q "$ZIP_FILE" -d project

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'
        cache-disabled: true

    - name: Build with Gradle
      run: |
        cd project
        # Ищем папку с проектом (там, где лежит settings.gradle)
        PROJECT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
        cd "$PROJECT_DIR"
        chmod +x gradlew || true
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FakeOrientation-Debug
        path: project/**/build/outputs/apk/debug/*.apk
        if-no-files-found: error

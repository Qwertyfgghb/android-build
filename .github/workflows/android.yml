name: Build APK from ZIP

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Устанавливаем JDK 17 и unzip
      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip openjdk-17-jdk

      # 3. Скачиваем и распаковываем Gradle 8.2
      - name: Install Gradle 8.2
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip gradle-8.2-bin.zip -d $HOME/gradle
          echo "PATH=$HOME/gradle/gradle-8.2/bin:$PATH" >> $GITHUB_ENV

      # 4. Распаковываем ZIP с проектом
      - name: Unzip project
        run: unzip 1.zip -d project

      # 5. Проверяем, какие модули видит Gradle
      - name: List Gradle projects
        run: |
          cd project
          gradle projects

      # 6. Собираем APK модуля app
      - name: Build APK
        run: |
          cd project
          gradle :app:assembleDebug --no-daemon --warning-mode all

      # 7. Загружаем APK как артефакт
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: project/app/build/outputs/apk/debug/app-debug.apk

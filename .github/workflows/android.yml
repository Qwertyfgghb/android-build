name: /devil - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Распаковываем именно devil-screen-on3.zip
      - name: Unzip /devil
        run: |
          rm -rf project
          mkdir project
          unzip -q devil-screen-on3.zip -d project

      # 4. Проверяем структуру
      - name: Check project
        run: |
          cd project/devil_work
          echo "=== Project ==="
          ls -la
          echo "=== App ==="
          ls -la app
          echo "=== Hook ==="
          ls -la hook

      # 5. Проверяем Gradle
      - name: Check Gradle
        run: |
          cd project/devil_work
          chmod +x gradlew
          ./gradlew projects --no-daemon

      # 6. Собираем APK
      - name: Build APK
        run: |
          cd project/devil_work
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      # 7. Загружаем APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: devil-debug
          path: project/devil_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
